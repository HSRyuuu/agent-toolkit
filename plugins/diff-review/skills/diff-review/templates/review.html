<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff Review</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
<script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html-ui.min.js"></script>
<style>
:root { --bg:#f7f7f8; --card:#fff; --fg:#1d1d1f; --mute:#6b6b72; --line:#e3e3e8;
  --H:#d93025; --M:#e8a400; --L:#1e8e3e; --A:#1e8e3e; --D:#d93025; --R:#6b5bd6; --Mo:#1a73e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#141416; --card:#1d1d20; --fg:#e8e8ea; --mute:#9a9aa3; --line:#2e2e33; } }
:root[data-theme="dark"] { --bg:#141416; --card:#1d1d20; --fg:#e8e8ea; --mute:#9a9aa3; --line:#2e2e33; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, "Segoe UI", sans-serif; }
main { max-width:1400px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:24px 0 8px; }
.mute { color:var(--mute); } code, .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
.chip { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:3px 10px; cursor:pointer; }
.chip.on { border-color:var(--fg); font-weight:600; }
.badge { display:inline-block; min-width:20px; text-align:center; border-radius:4px; padding:0 6px; color:#fff; font-weight:700; font-size:12px; }
.r-H{background:var(--H)} .r-M{background:var(--M)} .r-L{background:var(--L)}
.s-A{color:var(--A)} .s-D{color:var(--D)} .s-R{color:var(--R)} .s-M{color:var(--Mo)}
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--mute); font-weight:600; }
.tablewrap { overflow-x:auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; margin:8px 0; }
.card.done { opacity:.55; }
.head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; cursor:pointer; }
.head .path { font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; flex:1 1 300px; }
.body { padding:0 12px 12px; }
.sum { margin:2px 0 6px; } .why { font-size:12px; }
.methods { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.m { font-family:ui-monospace, Menlo, monospace; font-size:11px; border:1px solid var(--line); border-radius:4px; padding:1px 6px; }
.ep { font-size:12px; margin:4px 0; }
.diff { margin-top:8px; overflow-x:auto; }
.via { font-size:11px; }
ul.flat { margin:0; padding-left:18px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="sub" class="mute"></div>

  <h2>영향받는 진입점 <span class="mute" style="font-size:12px">호출 관계를 이름·타입으로 추정한 결과라 누락되거나 과하게 잡힐 수 있음</span></h2>
  <div class="tablewrap"><table id="eps"><thead><tr><th>종류</th><th>진입점</th><th>핸들러</th><th>호출 경로 (진입점 → 변경 메서드)</th></tr></thead><tbody></tbody></table></div>

  <h2>파일 추가 · 삭제 · 이름 변경</h2>
  <div id="fileops"></div>

  <h2>파일별 변경 <span class="mute" style="font-size:12px">변경 메서드 수 내림차순</span></h2>
  <div class="bar" id="filters"></div>
  <div id="files"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const KEY = "diff-review:" + DATA.repo + ":" + DATA.branch;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const state = { risk: new Set(["H","M","L"]), hideTest: false, hideDone: false, layout: "side-by-side" };

const cnt = r => DATA.files.filter(f => f.risk === r).length;
document.getElementById("title").textContent = `${DATA.repo} · ${DATA.branch}`;
document.getElementById("sub").textContent =
  `base ${DATA.base_ref}@${DATA.base} · 파일 ${DATA.files.length}개 · High ${cnt("H")} / Mid ${cnt("M")} / Low ${cnt("L")} · 진입점 ${DATA.endpoints.length}개`;

document.querySelector("#eps tbody").innerHTML = DATA.endpoints.length
  ? DATA.endpoints.map(e => `<tr><td><b>${esc(e.kind)}</b></td><td class="mono">${esc(e.label)}</td>
      <td class="mono">${esc(e.handler)}<div class="mute">${esc(e.file)}:${e.line}</div></td>
      <td class="via mono">${e.via.map(v => esc(v.path.join(" → "))).join("<br>")}</td></tr>`).join("")
  : `<tr><td colspan="4" class="mute">찾은 진입점이 없습니다</td></tr>`;

const ops = [
  ["추가", "A", DATA.added.map(esc)],
  ["삭제", "D", DATA.deleted.map(esc)],
  ["이름 변경", "R", DATA.renamed.map(([o, n]) => `${esc(o)} → ${esc(n)}`)],
].filter(o => o[2].length);
document.getElementById("fileops").innerHTML = ops.length
  ? ops.map(([t, s, xs]) => `<div><b class="s-${s}">${t} ${xs.length}</b><ul class="flat mono">${xs.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")
  : `<div class="mute">없음</div>`;

function filters() {
  const el = document.getElementById("filters");
  const chip = (label, on, fn) => { const b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.textContent = label; b.onclick = () => { fn(); filters(); files(); }; el.appendChild(b); };
  el.innerHTML = "";
  for (const r of ["H","M","L"]) chip(`${r} ${cnt(r)}`, state.risk.has(r), () => state.risk.has(r) ? state.risk.delete(r) : state.risk.add(r));
  chip("테스트 숨기기", state.hideTest, () => state.hideTest = !state.hideTest);
  chip("리뷰 완료 숨기기", state.hideDone, () => state.hideDone = !state.hideDone);
  chip(state.layout === "side-by-side" ? "양쪽 비교" : "한 줄 보기", true, () => { state.layout = state.layout === "side-by-side" ? "line-by-line" : "side-by-side"; });
  const n = DATA.files.filter(f => done[f.path]).length;
  const s = document.createElement("span"); s.className = "mute"; s.textContent = `리뷰 완료 ${n}/${DATA.files.length}`; el.appendChild(s);
}

function files() {
  const root = document.getElementById("files");
  root.innerHTML = "";
  for (const f of DATA.files) {
    if (!state.risk.has(f.risk) || (state.hideTest && f.kind === "test") || (state.hideDone && done[f.path])) continue;
    const card = document.createElement("div");
    card.className = "card" + (done[f.path] ? " done" : "");
    const fallback = f.trivial ? (f.status === "D" ? "파일 삭제" : "작은 변경 (요약 생략)") : "";
    card.innerHTML = `
      <div class="head">
        <input type="checkbox" title="리뷰 완료" ${done[f.path] ? "checked" : ""}>
        <span class="badge r-${f.risk}">${f.risk}</span>
        <b class="s-${f.status}">${f.status}</b>
        <span class="path">${f.old_path ? esc(f.old_path) + " → " : ""}${esc(f.path)}</span>
        <span class="mono"><span class="s-A">+${f.add}</span> <span class="s-D">-${f.del}</span></span>
        <span class="mute">메서드 ${f.methods.length}${f.class_level_lines ? ` · 메서드 밖 ${f.class_level_lines}줄` : ""}</span>
      </div>
      <div class="body">
        <div class="sum">${esc(f.summary || fallback)}</div>
        ${f.why ? `<div class="why mute">위험도 근거: ${esc(f.why)}</div>` : ""}
        ${f.methods.length ? `<div class="methods">${f.methods.map(m => `<span class="m" title="${m.lines}줄 변경"><b class="s-${m.change}">${m.change}</b> ${esc(m.sig.split("#")[1])}${m.endpoint ? " · " + esc(m.endpoint) : ""}</span>`).join("")}</div>` : ""}
        ${f.endpoints.length ? `<div class="ep">진입점: <span class="mono">${f.endpoints.map(esc).join(", ")}</span></div>` : ""}
        <div class="diff" hidden></div>
      </div>`;
    const box = card.querySelector(".diff");
    card.querySelector("input").onclick = ev => { ev.stopPropagation(); done[f.path] = ev.target.checked || undefined; save(); card.classList.toggle("done", ev.target.checked); filters(); };
    card.querySelector(".head").onclick = () => {
      box.hidden = !box.hidden;
      if (!box.hidden && !box.dataset.ok) {
        box.dataset.ok = 1;
        new Diff2HtmlUI(box, f.diff, { drawFileList: false, matching: "lines", outputFormat: state.layout,
          highlight: true, colorScheme: "auto", fileContentToggle: false }).draw();
      }
    };
    root.appendChild(card);
  }
}
filters(); files();
</script>
</body>
</html>
